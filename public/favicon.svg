<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="sGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Subtle Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Dark Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
  </defs>

  <!-- Background Squircle with Glowing Border -->
  <rect x="20" y="20" width="472" height="472" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Ambient Glow Effect behind S -->
  <path d="M 356 164 C 356 116 312 92 256 92 C 200 92 156 116 156 164 C 156 220 200 236 256 252 C 312 268 356 284 356 348 C 356 396 312 420 256 420 C 200 420 156 396 156 348" 
        fill="none" 
        stroke="url(#sGradient)" 
        stroke-width="64" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        opacity="0.3" 
        filter="url(#glow)" />

  <!-- Main Crisp 'S' Monogram -->
  <path d="M 356 164 C 356 116 312 92 256 92 C 200 92 156 116 156 164 C 156 220 200 236 256 252 C 312 268 356 284 356 348 C 356 396 312 420 256 420 C 200 420 156 396 156 348" 
        fill="none" 
        stroke="url(#sGradient)" 
        stroke-width="58" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
